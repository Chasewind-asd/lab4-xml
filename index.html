<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书目录</title>
    <style>
        body {
            font-family: Arial, "Microsoft YaHei", sans-serif;
            margin: 30px;
        }

        h1 {
            color: #2c3e50;
        }

        #status {
            margin: 10px 0;
            color: #555;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 800px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #f4f4f4;
        }

        tr:nth-child(even) {
            background: #fafafa;
        }
    </style>
</head>
<body>
    <h1>图书目录</h1>
    <p id="status">正在加载...</p>

    <table id="bookTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const statusEl = document.getElementById('status');
        const tbody = document.querySelector('#bookTable tbody');

        async function loadBooks() {
            try {
                const response = await fetch('book.xml');

                if (!response.ok) {
                    throw new Error('Fetch error: ' + response.status);
                }

                const xmlText = await response.text();

                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, 'text/xml');

                const parserError = xmlDoc.getElementsByTagName('parsererror')[0];
                if (parserError) {
                    throw new Error('XML parse error: ' + parserError.textContent);
                }

                const books = xmlDoc.getElementsByTagName('book');

                if (books.length === 0) {
                    statusEl.textContent = '没有找到图书数据。';
                    return;
                }

                Array.from(books).forEach(book => {
                    const id = book.getAttribute('id') || '';
                    const title = book.getElementsByTagName('title')[0]?.textContent.trim() || '';
                    const author = book.getElementsByTagName('author')[0]?.textContent.trim() || '';
                    const price = book.getElementsByTagName('price')[0]?.textContent.trim() || '';

                    const tr = document.createElement('tr');

                    [id, title, author, price].forEach(value => {
                        const td = document.createElement('td');
                        td.textContent = value;
                        tr.appendChild(td);
                    });

                    tbody.appendChild(tr);
                });

                statusEl.textContent = `成功加载 ${books.length} 本图书。`;
            } catch (err) {
                statusEl.textContent = '加载失败：' + err.message;
                console.error(err);
            }
        }

        loadBooks();
    </script>
</body>
</html>
